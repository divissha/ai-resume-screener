<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 {% extends 'base.html' %}

{% block content %}

<div class="min-h-screen flex items-center justify-center">
    <div class="bg-white shadow-2xl rounded-3xl p-10 w-full max-w-3xl">

    {% comment %} <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-2xl">

        <h1 class="text-4xl font-bold text-center mb-8">
            AI Resume Screener
        </h1> {% endcomment %}

        <h1 class="text-4xl font-extrabold text-center mb-3">
    AI Resume Screener
</h1>

<p class="text-center text-gray-500 mb-8">
    Upload your resume and compare it against a job description.
</p>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="mb-6">

    <label class="block text-sm font-semibold text-gray-700 mb-2">
        Upload Resume (PDF)
    </label>

    <input
        type="file"
        name="resume"
        accept=".pdf"
        class="block w-full text-sm text-gray-600
               file:mr-4
               file:py-3
               file:px-6
               file:rounded-lg
               file:border-0
               file:text-sm
               file:font-semibold
               file:bg-blue-600
               file:text-white
               hover:file:bg-blue-700
               cursor-pointer"
    >
</div>

            <div class="mb-6">

    <label class="block text-sm font-semibold text-gray-700 mb-2">
        Job Description
    </label>

    <textarea
        name="job_description"
        rows="8"
        class="w-full border border-gray-300 rounded-lg p-4
               focus:ring-2 focus:ring-blue-500
               focus:outline-none"
        placeholder="Paste the job description here..."
    ></textarea>

</div>

            <button
                class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700"
            >
                Analyze Resume
            </button>

        </form>

    </div>

</div>

{% endblock %}


</body>
</html>
