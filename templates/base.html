{% load static tailwind_tags %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>AI Resume Screener</title>

    {% tailwind_css %}

</head>

<body class="bg-slate-100">

    {% if user.is_authenticated %}

    Hello {{ user.username }}

    <a href="{% url 'logout' %}">
        Logout
    </a>

{% else %}

    <a href="{% url 'login' %}">
        Login
    </a>

    <a href="{% url 'register' %}">
        Register
    </a>

{% endif %}

    {% block content %}
    {% endblock %}

</body>
</html>
